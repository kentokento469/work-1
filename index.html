<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="WorkCore - 中小企業向け統合業務管理・自動化アプリ（デモ）" />
    <meta name="theme-color" content="#0f1f3d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WorkCore" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>WorkCore</title>
    <script>
      // テーマを描画前に適用してちらつきを防ぐ
      (function () {
        try {
          var t = localStorage.getItem('workcore-theme');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>このアプリを利用するには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
